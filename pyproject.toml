[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-commander"
version = "0.1.0"
description = "Survey ~/code projects by fusing git, agent conversation history, and in-project plan docs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
project-commander = "project_commander.cli:main"
pcmd = "project_commander.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_commander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
