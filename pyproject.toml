[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-commander"
version = "0.1.0"
description = "Survey ~/code projects by fusing git, agent conversation history, and in-project plan docs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["git", "cli", "agents", "claude", "cursor", "codex", "developer-tools", "fleet", "monorepo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
project-commander = "project_commander.cli:main"
pcmd = "project_commander.cli:main"

[project.urls]
Homepage = "https://github.com/smileynet/project-commander"
Repository = "https://github.com/smileynet/project-commander"
Issues = "https://github.com/smileynet/project-commander/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/project_commander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
